# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Builds and tests the ON configuration (RTA_BUILD_APP=ON -- the JUCE app,
# app/tests_juce, platform/tests_juce, ui/tests, rtatool_snapshot) that
# ci.yml never touches. ci.yml's three-OS matrix proves rta_core stays
# framework-free with RTA_BUILD_APP=OFF; it says nothing about
# MainComponent*.cpp, the view layer, or the app's own JUCE-linked tests,
# which until this job had no CI coverage at all and had to be rebuilt
# locally on every review round.
#
# A SEPARATE FILE, not a fourth matrix leg in ci.yml, on purpose:
#   - It runs on ONE OS (windows-latest) at the owner's own instruction
#     (2026-09-26): this job proves the ON configuration builds and its
#     tests pass, not that it is portable across compilers -- that claim
#     belongs to rta_core and ci.yml's three-OS matrix alone. Whether
#     RTA_BUILD_APP=ON also builds clean on ubuntu-latest/macos-latest has
#     not been attempted here and is not claimed. Folding this into
#     ci.yml's `strategy: matrix: os: [...]` would run it on all three
#     OSes with no evidence that is worth the wait -- a cold run here
#     already takes ~25 minutes (measured, PR #36's first run) -- and
#     would need an `if:` per-step gate scattered through a job that
#     otherwise treats all three OSes identically. A dedicated job with
#     `runs-on: windows-latest` says the same thing in one line.
#   - Its steps (JUCE cache, snapshot render, artifact upload) do not
#     apply to the OFF job at all. Interleaving them into ci.yml's single
#     job would make a reader check `if(RTA_BUILD_APP)`-shaped conditions
#     at every step instead of reading two short files.
#   - docs/GIT-WORKFLOW.md #3 already treats "the ON configuration is not
#     on CI" as one clause to update; a same-named-but-separate workflow
#     file is one line to add there and one line to remove if this job
#     is ever disabled without touching the OFF gate.
#
# Triggers: every push to main runs this job. A pull request runs it
# UNLESS every changed file is one the ON build cannot see: Python tools,
# their fixtures, docs, memory, or Markdown (owner decision 2026-09-26: the
# ~20-29 min job ran on tools-only and docs-only PRs for no information --
# docs/GIT-WORKFLOW.md "Rebuild what the change could have changed").
# `paths-ignore` skips the workflow only when ALL changed paths match, so
# one C++/CMake/workflow file in the PR brings the job back. A skipped
# workflow shows no check on the PR; that is expected for such a PR.
#
# HYBRID sccache trial (owner decision 2026-09-27, after PR #48's measured
# trial: baseline median 30.1 min, cold 32.5 min / 0% hit, warm 4.4 min
# (Build 2.45 min) / 98.7% hit on an empty commit -- see PR #48's body and
# docs/GIT-WORKFLOW.md #3 for the full numbers):
#   - On `pull_request`, only the Ninja + sccache leg below runs. It is the
#     one PR authors and reviewers see, and the one that amortizes across a
#     PR's own fix-round pushes (the ~25-min-per-round cost
#     docs/GIT-WORKFLOW.md already names).
#   - On `push` to `main`, a SECOND leg also runs: the plain Visual Studio
#     18 2026 generator, no sccache, matching CLAUDE.md's own Build section
#     exactly. Its purpose is NOT speed -- it is the generator every local
#     dev build actually uses, so a defect that is somehow specific to the
#     Ninja leg (a build-system quirk, not a compiler one: both legs still
#     call the same cl.exe/link.exe/rc.exe) surfaces on `main` shortly after
#     merge instead of staying invisible for the life of the project. This
#     is the answer to the trial PR's own open risk ("no local repro for a
#     Ninja-only bug"): `main` gets a repro path within one push.
#   - The push-to-main run of the Ninja leg ALSO exists to keep sccache's
#     GitHub Actions cache warm on the default branch. Per GitHub's cache
#     access rules (Actions docs, "Restrictions for accessing a cache":
#     a workflow run can restore a cache created on the current branch, the
#     base branch of a pull request, or the default branch), a cache entry
#     sccache writes from a `main` push is restorable by a pull_request run
#     whose base is `main` -- i.e. by any ordinary PR against this repo.
#     sccache's own GHA backend doc (mozilla/sccache docs/GHA.md) confirms
#     it authenticates with `ACTIONS_RESULTS_URL` / `ACTIONS_RUNTIME_TOKEN`,
#     the same tokens and the same underlying Actions cache/results service
#     `actions/cache` uses -- so this is the same access-scope guarantee,
#     not a different one sccache invented; GitHub's own docs are the
#     citation for the scope rule, sccache's docs are the citation for it
#     using that same service. A brand-new PR branch that has never pushed
#     under this workflow before therefore still gets *some* warm entries
#     (anything unchanged since the last `main` push), not just a fully
#     cold cache -- though a PR that touches many files will still see
#     fewer hits than the same-branch warm case PR #48 measured (98.7%,
#     which is an upper bound: an empty commit changes nothing at all).
#   - Only one leg uploads the `rtatool-snapshot-<run_number>` artifact
#     (the Ninja leg): `actions/upload-artifact` requires a unique name per
#     workflow run, and `github.run_number` is shared by both legs of the
#     same run, so a second upload under that name would collide.
name: CI (app ON)

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'memory/**'
      - '**/*.md'
      - 'tools/**/*.py'
      - 'tools/test_fixtures/**'

# A superseded push on a PR ref cancels that PR's own in-flight run, so an
# old commit never races a new one for the check mark. A push to `main` is
# never cancelled — every commit on `main` keeps its own CI record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  app-on:
    name: ${{ matrix.job_name }}
    runs-on: windows-latest

    # matrix, not two separate job blocks or YAML anchors (GitHub Actions'
    # YAML dialect does not support anchors/aliases): the two legs share
    # every step below verbatim except the generator, the launcher flags,
    # and which two steps are Ninja-only, so a matrix keeps the shared
    # steps written ONCE instead of duplicated across two job bodies.
    # `main_only` gates the VS leg to `push` events via the job-level `if:`
    # below, which GitHub evaluates once per expanded matrix combination
    # (so it sees THIS leg's own `matrix.main_only`, not the other leg's).
    strategy:
      fail-fast: false
      matrix:
        include:
          # Leg (a): unchanged name/behaviour from the PR #48 trial -- runs
          # on both pull_request and push, and is the one PR checks show.
          - job_name: "rtatool app (RTA_BUILD_APP=ON, windows-latest)"
            generator: Ninja
            generator_args: ""
            launcher_args: "-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
            use_sccache: true
            main_only: false
          # Leg (b): the generator every local dev build actually runs
          # (CLAUDE.md's own Build section: `-G "Visual Studio 18 2026"
          # -A x64`), no sccache, `main`-only -- see the file header for why.
          - job_name: "rtatool app (VS generator, main only)"
            generator: "Visual Studio 18 2026"
            generator_args: "-A x64"
            launcher_args: ""
            use_sccache: false
            main_only: true

    if: matrix.main_only == false || github.event_name == 'push'

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v5

      # sccache wraps cl.exe (CMAKE_<LANG>_COMPILER_LAUNCHER, set at Configure
      # below) and needs cl/link/rc on PATH -- vcvars, not just any MSVC
      # install. Ninja leg only: CMAKE_CXX_COMPILER_LAUNCHER is a
      # Makefiles/Ninja-only hook, ignored by the Visual Studio generator
      # (MSBuild drives cl.exe itself), so the VS leg has no use for either
      # this step or sccache and skips both.
      - name: Set up MSVC dev environment (vcvars for Ninja + cl.exe)
        if: matrix.use_sccache
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up sccache
        if: matrix.use_sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # --- JUCE cache -----------------------------------------------------
      #
      # CMakeLists.txt's own JUCE block (the `if(RTA_BUILD_APP)` /
      # `FetchContent_Declare(JUCE ...)` near line 196) is left completely
      # unmodified: this step does not add -DRTA_JUCE_PATH anywhere. What it
      # caches is a plain `git clone` of the same tag, fed to CMake through
      # `-DFETCHCONTENT_SOURCE_DIR_JUCE`, a first-class FetchContent
      # override (see FetchContent's own docs on FETCHCONTENT_SOURCE_DIR_< uc
      # name>): when it is set, FetchContent_MakeAvailable(JUCE) skips the
      # populate step ENTIRELY -- no git subprocess, no ExternalProject
      # subbuild -- and add_subdirectory()s straight into the given
      # directory. The CMakeLists.txt code path under test is identical
      # either way (FetchContent_Declare + FetchContent_MakeAvailable); only
      # the population source changes, exactly as it would if a developer
      # ran the same build twice with a warm FetchContent cache. Shared by
      # both legs -- the cached JUCE source tree is generator-independent,
      # so both write/read the same `juce-${{ runner.os }}-<tag>` key; a
      # concurrent miss on `push` (both legs cold at once) makes the second
      # cache save a harmless "already exists" no-op, not a failure.
      #
      # Why not cache build/_deps directly (the more obvious "cache the
      # FetchContent fetch" reading) -- MEASURED locally, not assumed: after
      # a full configure, _deps/juce-subbuild's own CMakeCache.txt records
      # the ABSOLUTE build-directory path it was configured in
      # (`build-ci-app-on/_deps/catch2-subbuild`, in the local repro). Restore
      # that tree under a build directory whose path differs by so much as
      # a drive-letter case and CMake refuses outright:
      #   CMake Error: The current CMakeCache.txt directory
      #   ".../build-ci-app-on2/_deps/catch2-subbuild/CMakeCache.txt" is
      #   different than the directory
      #   ".../build-ci-app-on/_deps/catch2-subbuild" where CMakeCache.txt
      #   was created.
      # That is a hard configure failure, not a slow cache miss -- worse than
      # not caching at all, since a mismatched cache now blocks the build
      # rather than merely costing minutes. A plain checkout has no such
      # state: it is bytes on disk, nothing in it names the build directory,
      # so `actions/cache` restoring it to any path is safe by construction.
      # This is requirement 2's own named escape hatch (cache a pre-fetched
      # checkout and pass a path) -- with FETCHCONTENT_SOURCE_DIR_JUCE
      # instead of RTA_JUCE_PATH so the configure line still reads
      # "-DRTA_BUILD_APP=ON" and nothing else, and CMakeLists.txt's own
      # FetchContent block is what actually runs.
      - name: Read JUCE tag from CMakeLists.txt
        id: juce
        shell: bash
        run: |
          tag=$(sed -n '/FetchContent_Declare(JUCE/,/)/p' CMakeLists.txt | grep -oE 'GIT_TAG[[:space:]]+\S+' | awk '{print $2}')
          if [ -z "$tag" ]; then
            echo "::error::could not read JUCE's GIT_TAG out of CMakeLists.txt" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cache JUCE checkout
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: juce-cache
          # Keyed on the tag, not a commit SHA: CMakeLists.txt pins
          # GIT_TAG 9.0.1, so the cache is exactly as reproducible as the
          # source it caches. A tag bump changes this key automatically --
          # nothing here needs editing by hand when JUCE_VERSION.md updates.
          key: juce-${{ runner.os }}-${{ steps.juce.outputs.tag }}

      - name: Fetch JUCE (cache miss)
        if: steps.juce-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rm -rf juce-cache
          git clone --branch "${{ steps.juce.outputs.tag }}" --depth 1 \
            https://github.com/juce-framework/JUCE.git juce-cache/juce-src

      # `matrix.generator`/`generator_args`/`launcher_args` are the only
      # per-leg differences here. Everything else -- RTA_BUILD_TESTS,
      # RTA_BUILD_APP, the FETCHCONTENT_SOURCE_DIR_JUCE override above -- is
      # identical between legs, so both configure the same ON tree; only the
      # build system driving the compiler differs.
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G "${{ matrix.generator }}" ${{ matrix.generator_args }} -DCMAKE_BUILD_TYPE=Release \
            -DRTA_BUILD_TESTS=ON -DRTA_BUILD_APP=ON \
            ${{ matrix.launcher_args }} \
            -DFETCHCONTENT_SOURCE_DIR_JUCE="$(pwd)/juce-cache/juce-src" \
            2>&1 | tee configure.log

      # Fix round PRs #36/#37 item 5: this job's own Configure step used to
      # be the visible half of the gap -- run 36229646563 (PR #36) printed
      # exactly one `CMake Warning`, from JUCEUtils.cmake:1798, because
      # `rtatool_snapshot`'s BUNDLE_ID defaulted to "com.AZ Soundtech.
      # rtatool_snapshot" (the space in COMPANY_NAME riding straight
      # through). app/CMakeLists.txt now gives that target an explicit,
      # space-free BUNDLE_ID, so this gate should start at 0 -- verified
      # against that same run before the fix (1 match) and re-checked by
      # this PR's own CI run after it. Same pattern and same shape as
      # ci.yml's own "Configure warnings" step, copied rather than
      # reimplemented so the two gates cannot quietly drift apart -- see
      # that step's own comment for fix round PR #40 LOW F5 (`CMake
      # Deprecation Warning` is a distinct message class a plain `CMake
      # Warning` grep misses). Both legs run this gate: it is generator-
      # agnostic and the whole point of leg (b) is not to silently exempt
      # the VS generator from anything leg (a) already checks.
      - name: Configure warnings
        shell: bash
        run: |
          count=$(grep -cE "CMake (Deprecation )?Warning" configure.log || true)
          echo "CMake warnings (windows-latest, app ON): $count"
          if [ "$count" != "0" ]; then
            grep -nE "CMake (Deprecation )?Warning" -A3 configure.log
            exit 1
          fi

      # Same --parallel 4 cap and the same reasoning as ci.yml's Build step:
      # an unbounded `--parallel` forks one compiler per ready translation
      # unit and OOMs a 4-vCPU runner (run 34972953923, ci.yml's own
      # comment). The ON tree compiles JUCE itself plus every app/ui/platform
      # target, so it is the biggest build this repository asks a CI runner
      # to do -- the cap matters here at least as much as it does OFF. Same
      # command for both legs: `--config Release` is consumed by the
      # multi-config VS generator and harmlessly ignored by the single-config
      # Ninja one (CMAKE_BUILD_TYPE=Release from Configure already fixed it).
      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4 2>&1 | tee build.log

      # Identical gate and identical pattern to ci.yml's Warnings step --
      # copied, not reimplemented, so the two jobs can never quietly drift
      # apart on what counts as a warning. See ci.yml's own comment for why
      # a log grep and not -Werror. Both legs run this gate for the same
      # reason as Configure warnings above.
      - name: Warnings
        shell: bash
        run: |
          pattern='warning( [A-Z]+[0-9]+)?:'
          count=$(grep -cE "$pattern" build.log || true)
          echo "warnings (windows-latest, app ON): $count"
          if [ "$count" != "0" ]; then
            grep -nE "$pattern" build.log
            exit 1
          fi

      # Prints sccache's hit/miss counters for THIS run as their own step
      # (mozilla-actions/sccache-action also writes a stats table to the job
      # summary on post-job, but a dedicated step keeps the numbers in the
      # plain step log too, where `gh run view --log` can grab them without
      # parsing the summary). Ninja leg only -- the VS leg never installs
      # sccache. `if: always()` so a build/test failure still reports what
      # sccache saw.
      - name: sccache stats
        if: always() && matrix.use_sccache
        shell: bash
        run: sccache --show-stats

      # The whole ON tree: platform/tests_juce, ui/tests, app/tests_juce
      # (rtatool_view_tests, rtatool_routing_live_tests, rtatool_export_tests)
      # plus every OFF-configuration test (core/tests, platform/tests,
      # app/tests), since RTA_BUILD_TESTS=ON pulls both in regardless of
      # RTA_BUILD_APP. No -R/-E label filter: see the PR body for why every
      # test in this tree already tolerates a CI box with no audio hardware
      # (platform/tests_juce/test_audio_io_contract.cpp's M1 cases call
      # AudioIo::start() and deliberately ignore its return value -- "a CI
      # box may have no device at all" is that file's own comment) and why
      # none of the JUCE-using test targets ever creates a window or a
      # desktop peer (each target's CMakeLists.txt says so; rtatool_snapshot
      # is the existing proof that this repo's JUCE code already renders
      # headlessly). Both legs run the full suite -- leg (b) is the one
      # whose ctest count is compared against leg (a)'s as the push-to-main
      # correctness check.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Offscreen render (CLAUDE.md "Seeing the GUI"): no window, no screen
      # capture, so it needs nothing from the runner beyond the binary it
      # just built. `cmd //c` is a Git-Bash-on-a-dev-machine workaround
      # (CLAUDE.md's own note: "direct invocation returns 127"); this step
      # runs under pwsh, the default shell action steps get on windows-latest
      # when no `shell:` is given, so the exe is invoked directly. Both legs
      # render (cheap, and it is real evidence the VS-built binary also
      # works, not just the Ninja-built one); only one leg uploads it below.
      - name: Render GUI snapshot
        run: |
          build\app\rtatool_snapshot_artefacts\Release\rtatool_snapshot.exe shots 1100 760
          Get-ChildItem shots\*.png | Format-Table Name, Length

      # Ninja leg only: `github.run_number` is shared by both legs of the
      # same workflow run, so both uploading `rtatool-snapshot-<run_number>`
      # would collide on the artifact name. The Ninja leg is the one PR
      # reviewers already look at (file header, "Its purpose ... is the one
      # PR checks show"), so it keeps the upload.
      - name: Upload GUI snapshot
        if: matrix.use_sccache
        uses: actions/upload-artifact@v4
        with:
          name: rtatool-snapshot-${{ github.run_number }}
          path: shots/*.png
          retention-days: 7
          if-no-files-found: error
